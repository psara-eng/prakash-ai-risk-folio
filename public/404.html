<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Prakash Sarangi</title>
    <script type="text/javascript">
      // This script takes the current URL (which GitHub thinks is a 404)
      // and converts it into a query parameter for the index page.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
